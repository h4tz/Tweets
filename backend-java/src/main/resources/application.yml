server:
  port: 4001

spring:
  application:
    name: twitter-backend-java

  datasource:
    url: jdbc:sqlite:dev-java.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    # DRF uses snake_case field names — mirror them globally
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: change-me-to-a-long-random-string-at-least-32-bytes-xx
    refresh-secret: change-me-to-a-different-long-random-string-yy
    access-ttl-minutes: 5
    refresh-ttl-days: 1
  cors:
    origin: "*"
